name: sl_cat_status
description: "SL CAT - PureStatus HD Video Status & Story Compressor (ByeBye Blur Status) for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Media & File Picking
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1

  # Video Playback & Handling
  video_player: ^2.8.6

  # PureStatus Core Video Engine: FFmpeg Kit (Maintained 2024-2026 Edition)
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.7

  # Sharing & Storage
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1

  # UI & Styling
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.3
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/sl_cat_watermark.png
